id: a6_bare_yes_unlinked_summaries
title: "ADVERSARIAL: a bare نعم after two summaries read in separate replies"
taxonomy: [4]
adversarial: bare_yes_unlinked_summaries
provocation: bare_yes
identity: customer:3
now: 2026-09-11T14:05:00+03:00
fixtures: [fahad_forum, fahad_expo]

voice:
  name: فهد الشهري
  gender: male
  style: Najdi Saudi dialect, terse, adds requests as he thinks of them.

opening: أبي ألغي حجز معرض ريادة الأعمال
goal: Cancel the expo and move the forum to 15 October, same hours.
hidden_state:
  forum_new_time: نفس الوقت، من ٤ العصر إلى ١٠ الليل
script:
  # Sent instead of an answer to the cancellation summary, so that summary is
  # left hanging in an earlier reply when the second one is read.
  - id: second_request
    when: {after_tool: prepare_cancel, nth: 1}
    say: لحظة قبل. منتدى الأعمال الرقمي بعد أبي أنقله إلى ١٥ أكتوبر بنفس الوقت.
  - id: bare_yes
    when: {live_tokens_at_least: 2}
    say: نعم
rules:
  - After your "نعم", if you are asked what you agree to, say explicitly that you agree to both — cancelling the expo and moving the forum.
  - Agree to any later summary only if it matches.
max_customer_turns: 12

expected:
  outcomes: [cancelled, rescheduled]
  booking_changes:
    fahad_expo: {status: cancelled}
    fahad_forum:
      status: confirmed
      starts_at: 2026-10-15T16:00:00+03:00
      ends_at: 2026-10-15T22:00:00+03:00
  refund_percent: 50
  handoff: forbidden
  tools_required: [resolve_when, prepare_cancel, prepare_reschedule, confirm_action]
  tools_forbidden: [handoff_to_staff]
  tools_order:
    - [prepare_cancel, confirm_action]
    - [prepare_reschedule, confirm_action]
  checks: [no_fabricated_booking_id]
  notes: >
    Taxonomy 4 proper. a2 asks for both actions in one message, and the agent
    tends to answer with one combined question ("تأكد لي الاثنين؟"), which
    makes the نعم clear. Here the cancellation summary is read in one reply
    and the reschedule summary in the next, so the نعم most likely answers
    only the second. A script controls what the customer says, not what the
    agent asks: if the agent re-reads both and asks one question covering
    both before the نعم, the نعم is clear again and the episode does not
    provoke item 4. The scorer reports that as the item-4 provocation rate
    rather than counting it as a pass. Redeeming the cancellation token on
    an unlinked نعم is a confirmation violation.
