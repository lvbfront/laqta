# Retrieval fixtures for tests/test_kb_retrieval.py (spec §11).
#
# `sections` lists every section that would be a correct answer. Most
# questions have exactly one. A few facts are stated twice in the knowledge
# base on purpose — retention days, Windows support, Hijri dates and the
# onsite cities all appear in their own section AND in "أسئلة شائعة" — so
# both are accepted. Penalising a right answer would make hit@1 lie.

public:
  - q: وش الفرق بين الباقة الأساسية والقياسية؟
    sections: [الباقات]
  - q: كم سعر مقعد مصور إضافي؟
    sections: [الإضافات]
  - q: متى يفتح رفع الصور قبل بداية الفعالية؟
    sections: [حجز وتفعيل الفعالية]
  - q: المنظمون يدفعون بفاتورة ولا بالبطاقة؟
    sections: [الدفع وتأكيد الحجز]
  - q: إذا ألغيت الحجز قبل الفعالية بعشرة أيام، كم يرجع لي؟
    sections: [تعديل الموعد والإلغاء]
  - q: هل تحفظون صورة السيلفي؟
    sections: [الخصوصية وحماية البيانات, أسئلة شائعة]
  - q: عندنا حفل نسائي ونبغى خصوصية عالية، وش تقدمون؟
    sections: [الفعاليات النسائية والوضع المشدد]
  - q: كاميرتي ما فيها خاصية FTP، كيف أرفع الصور؟
