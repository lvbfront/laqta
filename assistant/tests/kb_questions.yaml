  - q: وش المعلومات المطلوبة عشان أحجز فعالية؟
    sections: [حجز وتفعيل الفعالية]
  - q: برنامج الرفع متوفر لويندوز؟
    sections: [ربط الكاميرات, أسئلة شائعة]
  - q: كم مدة حفظ الصور في الوضع المشدد؟
    sections: [الفعاليات النسائية والوضع المشدد, أسئلة شائعة]
  - q: أقدر أحدد موعد الفعالية بالتاريخ الهجري؟
    sections: [حجز وتفعيل الفعالية, أسئلة شائعة]
  - q: كم مهلة الدفع بعد الحجز المبدئي؟
