# Answered only by internal sections. A customer or a visitor must never
# retrieve these chunks, however well the question matches them.
internal:
  - q: كم فعالية بدعم ميداني تغطون باليوم لكل مدينة؟
    sections: [سعة التشغيل]
  - q: العميل يطلب خصم، وش السياسة؟
    sections: [قواعد العروض والخصومات, متى يحوّل المساعد للموظف]
  - q: كم مهلة استلام التذكرة العاجلة؟
    sections: [أوقات الاستجابة والتصعيد]
  - q: أي فريق مسؤول عن تمديد فعالية شغالة؟
    sections: [الفرق والمسؤوليات, متى يحوّل المساعد للموظف]
  - q: متى أحوّل المحادثة لفريق المبيعات؟
    sections: [متى يحوّل المساعد للموظف, قواعد العروض والخصومات]

# Nothing in the knowledge base answers these, so search must return
# no_relevant_section and the instructions turn that into a handoff.
#
# The set is deliberately adversarial, because KB_MIN_SCORE is derived from
# the highest-scoring negative here: the flight question says "book" and
# names a city, the restaurant one names a city Laqta serves, and the tyre
# one is a how-to phrased like the camera-setup sections. The last two came
# from hand-testing (≈0.371 and ≈0.426), the tyre question landing just
# under the previous noise ceiling of 0.428 — which is why adding it can
# move the threshold. Widening this set is the cheapest way to make the
# threshold trustworthy; layer 2 should keep growing it.
off_topic:
  - كيف أطبخ الكبسة؟
  - وش سعر البيتكوين اليوم؟
  - من فاز بكأس العالم في كرة القدم؟
  - أبغى أحجز تذكرة طيران إلى القاهرة
  - وش أفضل مطعم في جدة؟
  - كيف أغير إطارات السيارة؟
