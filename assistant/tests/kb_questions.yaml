  - q: وش ساعات العمل عندكم؟
    sections: [ساعات العمل والتواصل]
  - q: هل الضيف يحتاج يحمّل تطبيق؟
    sections: [أسئلة شائعة, كيف تشتغل لقطة]
  - q: نبغى نتعرف على الضيوف بدون بيانات حيوية، وش الخيار؟
    sections: [طرق التعرّف على الضيوف]
  - q: كم أقصى مدة لفعالية واحدة؟
    sections: [حجز وتفعيل الفعالية]
  - q: هل فيه ألبوم عام يتصفح فيه الناس كل صور الفعالية؟
