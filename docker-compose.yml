services:
  # Postgres, Redis, MinIO and FTPS publish on 127.0.0.1 only: on a shared
  # Wi-Fi or phone hotspot (camera day) nothing but the API and web should
  # be reachable, and these run with dev default credentials. A real
  # FTP-capable camera on the LAN needs FTPS rebound to 0.0.0.0. The API
  # and worker reach them over the compose network, unaffected by this.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laqta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laqta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-laqta}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laqta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-laqta}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-laqta_dev_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://laqta:laqta_dev_password@postgres:5432/laqta}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
      - insightface_models:/root/.insightface
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://laqta:laqta_dev_password@postgres:5432/laqta}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    # Consumes both queues: photo_processing (app.workers.jobs.process_photo,
    # enqueued by the ingest API) and purge (app.workers.jobs.purge_expired_data,
    # enqueued on a timer by the purge-scheduler service below).
    command: rq worker -u ${REDIS_URL:-redis://redis:6379/0} photo_processing purge
    volumes:
      - ./api:/app
      - insightface_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ftps:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://laqta:laqta_dev_password@postgres:5432/laqta}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      FTPS_HOST: 0.0.0.0
      FTPS_PORT: ${FTPS_PORT:-2121}
      FTPS_PASSIVE_PORT_START: ${FTPS_PASSIVE_PORT_START:-30000}
      FTPS_PASSIVE_PORT_END: ${FTPS_PASSIVE_PORT_END:-30009}
      # Passive-mode data connections need the address a camera/agent can
      # actually reach -- unset (empty) is right for local dev (no NAT
      # hop between the client and this container); a real deployment
      # behind NAT/a cloud LB sets this to that public address.
      FTPS_MASQUERADE_ADDRESS: ${FTPS_MASQUERADE_ADDRESS:-}
    command: python -m app.ftps.server
    volumes:
      - ./api:/app
      - ftps_certs:/tmp/laqta-ftps
    ports:
      - "127.0.0.1:${FTPS_PORT:-2121}:2121"
      - "127.0.0.1:${FTPS_PASSIVE_PORT_START:-30000}-${FTPS_PASSIVE_PORT_END:-30009}:30000-30009"
    depends_on:
      postgres:
        condition: service_healthy

  purge-scheduler:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://laqta:laqta_dev_password@postgres:5432/laqta}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    # Timing only -- enqueues onto the purge queue every PURGE_INTERVAL_SECONDS
    # (default daily); the worker service actually runs the job. Without
    # this service nothing ever enqueues a purge run on its own, so
    # retention is unenforced no matter how correct app/workers/purge.py
    # is. See scripts/purge_scheduler.py and the README's "Purge job"
    # section for why this is an interval loop, not wall-clock cron.
    command: python scripts/purge_scheduler.py
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  insightface_models:
  ftps_certs:
